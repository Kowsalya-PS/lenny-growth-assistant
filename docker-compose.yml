version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lenny-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lenny-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/lenny_assistant
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      ACTIVE_PROVIDER: ollama
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres-data:
